[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegispt"
version = "0.1.0"
description = "AegisPT: Modular Cybersecurity Assessment and Research Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary / Academic Research"}
authors = [
    {name = "AegisPT Research Team"}
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "defusedxml>=0.7.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]
scanners = [
    "python-owasp-zap-v2.4>=0.0.24",
    "python-nmap>=0.7.1",
]

[tool.setuptools.packages.find]
include = ["aegispt*", "aegis_common*", "backend*", "modules*", "schemas*"]
exclude = ["tests*", "frontend*", "docker*", "lab*", "aegis_data*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
